# =============================================================================
# Custom Exclusion Rules — ft_transcendence WAF
#
# These rules MUST be loaded AFTER all CRS rules so that
# SecRuleUpdateTargetById / SecRuleRemoveById directives apply correctly.
# File name starts with "CUSTOM-" to ensure alphabetical load order places it
# at the end of the rules directory.
# =============================================================================

# -----------------------------------------------------------------------
# HEALTH CHECK ENDPOINTS
# Monitoring probes must never be blocked by the WAF engine.
# -----------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /health" \
    "id:10000,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    ctl:ruleEngine=Off"

SecRule REQUEST_URI "@beginsWith /waf-health" \
    "id:10001,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    ctl:ruleEngine=Off"

# -----------------------------------------------------------------------
# JWT BEARER TOKENS IN AUTHORIZATION HEADER
#
# JWT tokens are base64url-encoded and contain characters (dots, hyphens,
# long hex strings) that resemble SQL injection and XSS payloads.
# Exclude the Authorization header from the most common SQLi / XSS rules.
# -----------------------------------------------------------------------

# SQLi keyword / comment detection
SecRuleUpdateTargetById 942100 "!REQUEST_HEADERS:Authorization"
SecRuleUpdateTargetById 942190 "!REQUEST_HEADERS:Authorization"
SecRuleUpdateTargetById 942200 "!REQUEST_HEADERS:Authorization"
SecRuleUpdateTargetById 942260 "!REQUEST_HEADERS:Authorization"
SecRuleUpdateTargetById 942300 "!REQUEST_HEADERS:Authorization"
SecRuleUpdateTargetById 942370 "!REQUEST_HEADERS:Authorization"
SecRuleUpdateTargetById 942430 "!REQUEST_HEADERS:Authorization"
SecRuleUpdateTargetById 942440 "!REQUEST_HEADERS:Authorization"

# XSS tag / event-handler detection
SecRuleUpdateTargetById 941100 "!REQUEST_HEADERS:Authorization"
SecRuleUpdateTargetById 941110 "!REQUEST_HEADERS:Authorization"
SecRuleUpdateTargetById 941130 "!REQUEST_HEADERS:Authorization"
SecRuleUpdateTargetById 941150 "!REQUEST_HEADERS:Authorization"
SecRuleUpdateTargetById 941160 "!REQUEST_HEADERS:Authorization"
SecRuleUpdateTargetById 941170 "!REQUEST_HEADERS:Authorization"
SecRuleUpdateTargetById 941200 "!REQUEST_HEADERS:Authorization"

# -----------------------------------------------------------------------
# WEBSOCKET UPGRADE REQUESTS
#
# WebSocket upgrade handshakes (used by the game service) carry an
# "Upgrade: websocket" header that can trigger protocol-level rules.
# -----------------------------------------------------------------------
SecRule REQUEST_HEADERS:Upgrade "@streq websocket" \
    "id:10010,\
    phase:1,\
    nolog,\
    pass,\
    t:lowercase,\
    ctl:ruleEngine=Off"

# -----------------------------------------------------------------------
# FASTAPI AUTOMATIC DOCUMENTATION ENDPOINTS
#
# FastAPI generates interactive API docs at /api/docs and /api/redoc.
# The Swagger UI payload and the openapi.json schema contain long JSON
# structures that may trigger body-size or content rules.
# -----------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /api/docs" \
    "id:10020,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    ctl:ruleEngine=Off"

SecRule REQUEST_URI "@beginsWith /api/redoc" \
    "id:10021,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    ctl:ruleEngine=Off"

SecRule REQUEST_URI "@beginsWith /api/openapi.json" \
    "id:10022,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    ctl:ruleEngine=Off"

# -----------------------------------------------------------------------
# VITE / REACT DEV SERVER HOT-MODULE REPLACEMENT
#
# The Vite HMR endpoint uses a specific path pattern that can trigger
# false positives.
# -----------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /@vite" \
    "id:10030,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    ctl:ruleEngine=Off"

SecRule REQUEST_URI "@beginsWith /__vite" \
    "id:10031,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    ctl:ruleEngine=Off"
