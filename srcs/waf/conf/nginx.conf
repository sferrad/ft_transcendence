load_module modules/ngx_http_modsecurity_module.so;

# -----------------------------------------------------------------------------
# FICHIER: nginx.conf (WAF)
#
# Rôle:
# - Ce conteneur "waf" (nginx + ModSecurity/OWASP CRS) est l'entrée unique exposée
#   vers l'hôte.
#
# Petit glossaire :
# - **WAF**: Web Application Firewall. Ici: ModSecurity + règles OWASP CRS.
#   Il analyse les requêtes et peut bloquer des patterns d'attaque (SQLi, XSS, etc.).
# - **Reverse proxy**: Nginx reçoit la requête puis la "forward" vers un autre service.
# - **Upstream**: groupe de serveurs backend (ici: `api-gateway`, `frontend`).
# - **DNS resolver**: permet à Nginx de re-trouver l'IP d'un service par son nom.
# - **Rate limit**: limite le nombre de requêtes par IP pour éviter brute-force/DDoS.
# - **Location**: règle de routage Nginx qui match une URL (`/api/`, regex, etc.).
#
# Liens avec docker-compose:
# - service "waf" publie:
#     - 8080:80  (HTTP)
#     - 8443:443 (HTTPS)
# - service "frontend" expose 3000 (Vite dev server, non publié directement)
# - service "api-gateway" expose 8000
#
# Routage appliqué ici:
# - /api/*  -> api-gateway:8000  (les routes FastAPI)
# - /ws/*   -> api-gateway:8000/ws/* (WebSockets)
# - /       -> frontend:3000 (React/Vite)
#
# Objectif principal:
# - Avoir une seule origine côté navigateur (http://localhost:8080),
#   et faire transiter l'API via /api/* pour éviter CORS.
# -----------------------------------------------------------------------------

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # -------------------------------------------------------------------------
    # 1) DNS dynamique (anti-502 après rebuild)
    # -------------------------------------------------------------------------
    # DNS / Résolution (point clé pour éviter les 502):
    # - Dans un réseau de conteneurs, les services (api-gateway, frontend) peuvent changer d'IP
    #   à chaque rebuild/recreate (`--build`, `--force-recreate`, crash/restart...).
    # - Par défaut, Nginx résout les hostnames au démarrage puis garde l'IP en cache.
    #   Conséquence classique: après recréation de `api-gateway`, Nginx continue d'appeler
    #   l'ancienne IP -> `502 Bad Gateway` / `Host is unreachable`.
    #
    # Solution appliquée:
    # - `resolver` + `upstream ... resolve;` => Nginx re-résout périodiquement les hostnames.
    # - `valid=10s` => durée de cache DNS interne de Nginx (il reconsulte le DNS après).
    #
    # Resolver list:
    # - 127.0.0.11 : DNS interne Docker (si vous lancez la stack avec Docker).
    # - 10.89.x.1  : DNS du réseau Podman (visible dans /etc/resolv.conf du conteneur).
    # Astuce: si tu ne sais pas quel DNS utiliser dans le conteneur,
    # regarde `/etc/resolv.conf` *dans* le conteneur `waf`.
    resolver 127.0.0.11 10.89.3.1 10.89.1.1 ipv6=off valid=10s;
    resolver_timeout 2s;

    upstream api_gateway_upstream {
        # `zone` = mémoire partagée pour stocker l'état de l'upstream (utile avec resolve/keepalive).
        zone api_gateway_upstream 64k;
        # `resolve` = Nginx re-résout le hostname régulièrement via `resolver`.
        server api-gateway:8000 resolve;
        # `keepalive` = garde des connexions ouvertes vers le backend (perf).
        keepalive 32;
    }

    upstream frontend_upstream {
        zone frontend_upstream 64k;
        server frontend:3000 resolve;
        keepalive 32;
    }

    # WebSockets 
    # - Un WebSocket commence comme une requête HTTP normale, puis "upgrade" la connexion.
    # - Si le client envoie `Upgrade: websocket`, il faut aussi envoyer `Connection: upgrade`.
    # - `map` permet de fabriquer proprement la valeur du header Connection.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Activer ModSecurity 
    # - `modsecurity on;` ici = actif partout par défaut.
    # - Ensuite, on peut faire des exceptions par `location` via `modsecurity off;`
    #   (typiquement pour Vite dev, sinon faux positifs).
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/setup.conf;

    # Note : ModSecurity est un module. Il prend la requête HTTP, la compare
    # aux règles OWASP CRS, et peut décider de bloquer (403) ou laisser passer.
    # En dev, certains assets Vite/HMR ressemblent à des payloads "bizarres" => faux positifs.
    # D'où les `modsecurity off;` ciblés sur `/@vite/`, `/src/`, etc.

    # Logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Rate Limiting - Protection contre DDoS/brute force 
    # - zone=api_limit: limite générale pour /api/
    # - zone=login_limit: plus strict pour les routes sensibles (login/register)
    #
    # Rappel rapide:
    # - `limit_req_zone` : définit une zone de comptage (par IP ici) + une vitesse.
    # - `limit_req`      : applique concrètement la zone dans une location.
    #
    # Unités:
    # - `10r/s` = 10 requêtes par seconde
    # - `5r/m`  = 5 requêtes par minute
    #
    # `zone=...:10m` = mémoire partagée allouée à cette table (10 MB).
    # `$binary_remote_addr` = IP du client en binaire (plus compact que `$remote_addr`).
    # -> on limite "par IP".
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Différence `limit_req` vs `limit_conn` (important):
    # - `limit_req` limite un *débit* (requêtes / seconde ou minute).
    # - `limit_conn` limite le *nombre de connexions simultanées*.
    #   Exemple: un client qui ouvre 200 connexions idle (attaque) -> limit_conn le calme.

    # Quand `limit_req` se déclenche, Nginx renvoie **503** par défaut
    # (souvent avec une page HTML). Pour une API, ce n'est pas idéal.
    #
    # Ce qu'on veut à la place:
    # - **429 Too Many Requests** : le code standard pour dire "tu as trop de requêtes"
    # - un **body JSON** : facile à parser côté frontend/clients
    # - un header **Retry-After** : indique en secondes quand réessayer
    #
    # Le body JSON est défini plus bas via `error_page 429` dans chaque `server {}`.
    limit_req_status 429;

    # Timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # Limites de taille
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Headers de sécurité globaux
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Cacher la version de Nginx
    server_tokens off;

   
    server {
        listen 80;
        server_name _;

        # 50 connexions max par IP vers ce serveur (HTTP).
        limit_conn conn_limit 50;

        location /health {
            # Pas de strip ici: on cible directement la route /health du gateway.
            proxy_pass http://api_gateway_upstream/health;
        }

        # API Gateway - toutes les requêtes /api/
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;

            # `burst=10` = on tolère des "pics" temporaires (jusqu'à 10 requêtes en rafale).
            # `nodelay` = si ça dépasse le rate, Nginx ne met pas en file d'attente,
            #             il rejette directement (429). Très utile côté API.

            # IMPORTANT: le slash final dans proxy_pass contrôle la réécriture du chemin.
            # - Avec `proxy_pass http://.../;` (slash final):
            #     /api/auth/login  -> /auth/login  (on "strip" /api/)
            # - Sans slash final `proxy_pass http://...;`:
            #     /api/auth/login  -> /api/auth/login (on garde /api/)
            #
            # Ici l'API Gateway expose `/auth/login` (pas `/api/auth/login`).
            # On utilise l'upstream `api_gateway_upstream` (avec `resolve`) pour que la
            # résolution DNS reste correcte même si le conteneur change d'IP.
            proxy_pass http://api_gateway_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Headers proxy :
            # - `X-Real-IP`         : IP client brute
            # - `X-Forwarded-For`   : chaîne d'IPs traversées (client -> proxy -> ...)
            # - `X-Forwarded-Proto` : http/https (utile pour générer des URLs correctes)

            # Timeouts proxy
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Endpoints sensibles - rate limiting strict 
        # On cible uniquement les endpoints réellement sensibles (évite de limiter /api/auth/me).
        # - /api/auth/login (api-gateway)
        # - /api/auth/register (si utilisé)
        # - /api/users/auth/register (proxy vers user-service via api-gateway)
        location ~ ^/api/(auth/(login|register)|users/auth/register)$ {
            limit_req zone=login_limit burst=3 nodelay;

            # Ici on limite plus fort car:
            # - login/register sont des cibles de brute-force
            # - on veut protéger le user-service derrière

            # Pourquoi cette location "regex" ne casse pas la location `/api/` au-dessus ?
            # - Nginx choisit d'abord la meilleure location "préfixe" (ici `/api/`),
            #   puis essaie les regex `location ~ ...`.
            # - Si la regex matche, elle prend la main.
            # - On n'a PAS mis `location ^~ /api/` exprès, sinon la regex ne serait jamais testée.

            # Cette location existe uniquement pour appliquer un rate-limit plus strict.
            # Le `rewrite` enlève le préfixe `/api/` pour que l'upstream voie `/auth/login`.
            #
            # Détail regex:
            # - `^/api/(.*)$` : capture tout ce qui suit `/api/`
            # - `/$1`         : réinjecte "le reste" en supprimant `/api/`
            # - `break`       : stoppe le moteur de rewrite pour éviter d'autres transformations
            rewrite ^/api/(.*)$ /$1 break;

            # Même idée: upstream résolu dynamiquement (évite 502 après recreate).
            proxy_pass http://api_gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket pour le jeu/chat
        location /ws/ {
            # WebSockets (Upgrade/Connection) vers l'api-gateway.
            # Ici on forward /ws/* vers /ws/* (pas de strip de préfixe).
            proxy_pass http://api_gateway_upstream/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            # Ici on force Connection=upgrade car on est *sûr* d'être en WebSocket.
            # Alternative possible: `proxy_set_header Connection $connection_upgrade;`
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # Frontend - tout le reste
        location / {
                modsecurity on;
            # UI servie par le dev server Vite (React) derrière le WAF.
            # Dans docker-compose: service "frontend" écoute 3000.
            proxy_pass http://frontend_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Répétition des headers globaux 
            # - En Nginx, si tu mets `add_header` dans une `location`, tu n'hérites pas
            #   automatiquement de ceux du bloc `http {}`.
            # - Donc on les répète ici pour être sûr.
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self';" always;
        }

        # Autoriser les dépendances Vite en mode dev 
        # - Ces routes existent uniquement en mode DEV (Vite).
        # - En PROD, ton frontend serait buildé en fichiers statiques et tu ne verrais pas ces URLs.
        # - On met `modsecurity off` ici car CRS peut prendre ces blobs JS pour des attaques.
        location ^~ /node_modules/.vite/ {
            # Exclusion ciblée: on coupe ModSecurity sur les assets dev générés par Vite
            # (sinon risque de faux positifs / blocages).
            modsecurity off;
            proxy_pass http://frontend_upstream/node_modules/.vite/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

            # Endpoints techniques Vite/HMR en dev (exclusions ciblées)
            location ^~ /@vite/ {
                # Endpoints Vite (dev) nécessaires au fonctionnement du HMR.
                modsecurity off;
                proxy_pass http://frontend_upstream/@vite/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location = /@react-refresh {
                # React Fast Refresh (dev).
                modsecurity off;
                proxy_pass http://frontend_upstream/@react-refresh;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location ^~ /src/ {
                # Accès aux sources en dev (Vite sert /src/*).
                modsecurity off;
                proxy_pass http://frontend_upstream/src/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

        # Bloquer l'accès aux fichiers sensibles
        location ~ /\. {
            # Bloque les fichiers cachés type .env, .git, etc.
            return 404;
        }

        # Page d'erreur personnalisée pour les blocages WAF
        error_page 403 /403.html;
        location = /403.html {
            internal;
            return 403 '{"error": "Request blocked by security policy"}';
            add_header Content-Type application/json;
        }

        # `internal;` signifie: on ne peut pas appeler `/403.html` ou `/429.json` directement.
        # Ce sont des endpoints "internes" utilisés uniquement par Nginx quand il veut
        # fabriquer une réponse d'erreur.

        # Réponse rate-limit (API-friendly)
        # - Transforme l'événement "rate limit" de Nginx en réponse JSON.
        # - Ajoute `Retry-After` (en secondes) pour aider le client à temporiser.
        error_page 429 /429.json;
        location = /429.json {
            internal;
            add_header Content-Type application/json always;
            add_header Retry-After 60 always;
            # `Retry-After: 60` = "réessaie dans 60 secondes".
            return 429 '{"error":"Too many requests","detail":"Rate limit exceeded","retry_after":60}';
        }
    }

    # -------------------------------------------------------------------------
    # Serveur HTTPS (8443 côté host -> 443 dans le conteneur)
    #
    # Pourquoi ça ne marchait pas avant ?
    # - docker-compose publie bien 8443:443, mais notre config n'avait qu'un
    #   `server { listen 80; }`.
    # - Résultat: le port 443 était bien exposé, mais Nginx ne parlait pas TLS dessus,
    #   donc le navigateur/curl voyait une "connection reset" pendant le handshake.
    #
    # Certificat:
    # - L'image owasp/modsecurity-crs génère un certificat auto-signé au démarrage.
    # - Chemins observés dans les logs: /etc/nginx/conf/server.crt et /etc/nginx/conf/server.key
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/conf/server.crt;
        ssl_certificate_key /etc/nginx/conf/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # ici on termine TLS au niveau du WAF.
        # - le navigateur parle HTTPS avec le WAF
        # - le WAF parle HTTP (réseau interne) avec api-gateway/frontend

        limit_conn conn_limit 50;

        location /health {
            proxy_pass http://api_gateway_upstream/health;
        }

        # API Gateway - toutes les requêtes /api/
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://api_gateway_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Endpoints sensibles - rate limiting strict
        # On cible uniquement les endpoints réellement sensibles (évite de limiter /api/auth/me).
        location ~ ^/api/(auth/(login|register)|users/auth/register)$ {
            limit_req zone=login_limit burst=3 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api_gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket pour le jeu/chat
        location /ws/ {
            proxy_pass http://api_gateway_upstream/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # Frontend - tout le reste
        location / {
            modsecurity on;
            proxy_pass http://frontend_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self';" always;
        }

        # Autoriser les dépendances Vite en mode dev
        location ^~ /node_modules/.vite/ {
            modsecurity off;
            proxy_pass http://frontend_upstream/node_modules/.vite/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Endpoints techniques Vite/HMR en dev (exclusions ciblées)
        location ^~ /@vite/ {
            modsecurity off;
            proxy_pass http://frontend_upstream/@vite/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /@react-refresh {
            modsecurity off;
            proxy_pass http://frontend_upstream/@react-refresh;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /src/ {
            modsecurity off;
            proxy_pass http://frontend_upstream/src/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Bloquer l'accès aux fichiers sensibles
        location ~ /\. {
            return 404;
        }

        # Page d'erreur personnalisée pour les blocages WAF
        error_page 403 /403.html;
        location = /403.html {
            internal;
            return 403 '{"error": "Request blocked by security policy"}';
            add_header Content-Type application/json;
        }

        # Réponse rate-limit (API-friendly)
        error_page 429 /429.json;
        location = /429.json {
            internal;
            add_header Content-Type application/json always;
            add_header Retry-After 60 always;
            return 429 '{"error":"Too many requests","detail":"Rate limit exceeded","retry_after":60}';
        }
    }
}

