load_module modules/ngx_http_modsecurity_module.so;

# -----------------------------------------------------------------------------
# CONFIGURATION DU WAF
#
# Ce fichier definit le point d'entree HTTP/HTTPS du projet.
# Le conteneur "waf" sert de facade publique: il recoit les requetes du navigateur,
# applique les regles de securite, puis redirige le trafic vers le frontend ou vers
# l'API gateway selon le chemin demande.
#
# Lecture rapide de l'architecture:
# - WAF: Web Application Firewall. Ici, Nginx + ModSecurity + OWASP CRS.
#   Le WAF inspecte les requetes entrantes et peut bloquer des attaques connues
#   comme les tentatives SQLi, XSS, traversal ou les payloads suspects.
# - Reverse proxy: Nginx ne sert pas seulement du contenu, il relaie aussi les
#   requetes vers un service interne cible en conservant le contexte utile.
# - Upstream: groupe de backends declare une seule fois puis reutilise dans les
#   blocs `location` pour garder une configuration lisible et centralisee.
# - DNS resolver: indispensable en environnement conteneurise, car les IP peuvent
#   changer apres un rebuild ou un recreate. Nginx doit donc re-resoudre les noms.
# - Rate limiting: protection applicative contre le brute force, les abus et les
#   rafales de requetes venant d'une meme IP.
# - Location: regle de routage Nginx qui choisit le traitement d'une URL selon
#   son prefixe ou sa regex.
#
# Correspondance avec docker-compose:
# - service "waf" publie:
#     - 8080:80  pour le HTTP de dev ou de debug
#     - 8443:443 pour le HTTPS expose au navigateur
# - service "frontend" ecoute sur 3000 en interne pour Vite
# - service "api-gateway" ecoute sur 8000 en interne pour les routes FastAPI
#
# Routage logique applique ici:
# - /api/*  -> api-gateway:8000  (routes REST et endpoints applicatifs)
# - /ws/*   -> api-gateway:8000/ws/* (canal temps reel Socket.IO / WebSocket)
# - /       -> frontend:3000 (application React/Vite)
#
# Objectif principal:
# - Garder une seule origine visible cote navigateur pour simplifier le CORS.
# - Centraliser la securite au niveau du WAF.
# - Isoler le frontend et le backend derriere un point d'entree unique.
# -----------------------------------------------------------------------------

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # -------------------------------------------------------------------------
    # 1) Resolution DNS dynamique pour eviter les 502 apres un rebuild
    # -------------------------------------------------------------------------
    # Pourquoi cette section existe:
    # - Dans un environnement compose/Podman/Docker, les conteneurs backend et
    #   frontend peuvent etre recrees a tout moment.
    # - Chaque recreation peut donner une nouvelle IP a `api-gateway` ou `frontend`.
    # - Nginx, sans configuration speciale, resout souvent les noms une seule fois
    #   au demarrage puis conserve cette adresse en cache.
    #
    # Effet secondaire sans `resolver`:
    # - Le WAF continue d'envoyer le trafic vers une ancienne IP.
    # - Le navigateur recoit alors des erreurs du type `502 Bad Gateway`.
    # - Le probleme apparait typiquement apres un `docker compose up --build`, un
    #   `--force-recreate` ou un redemarrage de service.
    #
    # Choix technique applique ici:
    # - `resolver` force Nginx a reconsulter le DNS interne a intervalle regulier.
    # - `upstream ... resolve;` permet a Nginx de suivre les changements d'adresse.
    # - `valid=10s` limite la duree du cache DNS cote Nginx pour rester reactif.
    #
    # DNS possibles selon le moteur de conteneur:
    # - 127.0.0.11 : DNS interne Docker.
    # - 10.89.x.1   : DNS du reseau Podman.
    # Astuce pratique: verifier `/etc/resolv.conf` depuis le conteneur `waf` si
    # l'on veut confirmer le resolver reellement utilise.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 2s;

    upstream api_gateway_upstream {
        # `zone` = mémoire partagée pour stocker l'état de l'upstream (utile avec resolve/keepalive).
        zone api_gateway_upstream 64k;
        # `resolve` = Nginx re-résout le hostname régulièrement via `resolver`.
        server api-gateway:8000 resolve;
        # `keepalive` = garde des connexions ouvertes vers le backend (perf).
        keepalive 32;
    }

    upstream frontend_upstream {
        zone frontend_upstream 64k;
        server frontend:3000 resolve;
        keepalive 32;
    }

    proxy_ssl_server_name on;
    proxy_ssl_name api-gateway;
    proxy_ssl_trusted_certificate /certs/ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;

    # WebSockets
    # - Une connexion WebSocket debute comme une requete HTTP standard, puis la
    #   connexion est "upgrade" vers un canal persistant bidirectionnel.
    # - Le header `Upgrade` indique le passage au protocole WebSocket.
    # - Le header `Connection` doit etre adapte pour que le proxy preserve cet
    #   upgrade au lieu de refermer la requete comme une simple requete HTTP.
    # - `map` sert ici a calculer proprement la valeur du header en fonction de la
    #   presence ou non de `Upgrade` cote client.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Activation globale de ModSecurity
    # - `modsecurity on;` active les regles de securite sur le trafic entrant.
    # - L'idee est d'appliquer la protection partout par defaut.
    # - Les exceptions sont ensuite traitees localement par `location` lorsque des
    #   chemins techniques ou de developpement provoquent de faux positifs.
    # - C'est volontaire: la politique de securite reste stricte, mais elle est
    #   assouplie uniquement la ou cela est techniquement necessaire.
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/setup.conf;

    # Note importante:
    # - ModSecurity est un moteur d'inspection qui analyse la requete HTTP avant
    #   qu'elle n'arrive a l'application cible.
    # - Les regles OWASP CRS apportent une base de detection predefinie pour les
    #   attaques courantes et les comportements suspects.
    # - En environnement de developpement, certains chemins generes par Vite ou
    #   par le hot reload peuvent ressembler a des patterns inhabituels.
    # - Les `modsecurity off;` sont donc reserves a des emplacements tres precis
    #   afin de limiter les faux positifs sans affaiblir toute la zone.

    # Logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Rate limiting et protection contre les abus
    # - `zone=api_limit` encadre le trafic general vers l'API.
    # - `zone=login_limit` impose une politique plus stricte pour les actions
    #   sensibles comme la connexion ou l'inscription.
    # - `zone=chat_limit` laisse une marge plus large pour les echanges temps reel,
    #   qui peuvent produire beaucoup de trafic legitime.
    #
    # Rappel conceptuel:
    # - `limit_req_zone` definit une table de comptage par IP avec un debit cible.
    # - `limit_req` applique cette table a un chemin precis.
    # - `limit_conn_zone` / `limit_conn` limitent le nombre de connexions ouvertes
    #   simultanement par source.
    #
    # Unites utiles:
    # - `10r/s` = dix requetes par seconde.
    # - `5r/m`  = cinq requetes par minute.
    #
    # `zone=...:10m` reserve 10 Mo de memoire partagee pour stocker ces compteurs.
    # `$binary_remote_addr` represente l'adresse IP du client de facon compacte,
    # ce qui permet de comptabiliser efficacement les requetes par origine.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=1000r/s;

    # Difference entre `limit_req` et `limit_conn`:
    # - `limit_req` controle le rythme d'arrivee des requetes.
    # - `limit_conn` controle la quantite de connexions simultanees deja ouvertes.
    # - Les deux sont complementaires: un abus peut consister soit a envoyer trop
    #   de requetes, soit a garder artificiellement beaucoup de connexions ouvertes.

    # Lorsque `limit_req` se declenche, Nginx renvoie par defaut un code 503.
    # Pour une API moderne, ce n'est pas le meilleur signal.
    #
    # Le comportement voulu ici:
    # - `429 Too Many Requests` pour indiquer clairement un blocage de quota.
    # - Une reponse JSON pour que le frontend puisse la consommer sans parsing
    #   HTML inutile.
    # - Un header `Retry-After` pour dire au client quand retenter.
    #
    # Le corps JSON concret est defini plus bas via `error_page 429` dans le
    # serveur HTTPS.
    limit_req_status 429;

    # Timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # Limites de taille
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Headers de sécurité globaux
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Cacher la version de Nginx
    server_tokens off;

   
    server {
        listen 80;
        server_name _;

        # Redirige tout le trafic HTTP vers la version HTTPS du WAF.
        return 301 https://$host:8443$request_uri;
    }

    # -------------------------------------------------------------------------
    # Serveur HTTPS (8443 cote hote -> 443 dans le conteneur)
    #
    # Pourquoi ce bloc est essentiel:
    # - Le compose expose 8443 sur la machine hote et le redirige vers 443 dans
    #   le conteneur du WAF.
    # - Sans un `server { listen 443 ssl; }`, le navigateur atteindrait bien le
    #   port publie, mais ne trouverait pas de terminaison TLS valide.
    # - Le resultat serait une erreur pendant le handshake TLS, souvent visible
    #   comme une connexion interrompue ou reinitialisee.
    #
    # Certificat:
    # - Le projet utilise des certificats internes pour le developpement et les
    #   tests locaux.
    # - Les chemins declares ci-dessous correspondent au couple certificat/cle
    #   charge par Nginx pour terminer le TLS au niveau du WAF.
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /certs/internal.crt;
        ssl_certificate_key /certs/internal.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Terminaison TLS au niveau du WAF:
        # - le navigateur parle en HTTPS avec Nginx/ModSecurity;
        # - une fois la requete acceptee, le WAF relaie ensuite le trafic vers les
        #   services internes sur le reseau prive du compose.
        # Ce choix centralise la securite et simplifie la gestion des certificats.

        limit_conn conn_limit 50;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location /health {
            proxy_pass https://api_gateway_upstream/health;
        }

            # Support Swagger/OpenAPI (FastAPI)
            # - Quand on consulte Swagger UI via `/api/docs`, FastAPI continue souvent
            #   de chercher le schema OpenAPI a `/openapi.json`.
            # - Sans ce bloc explicite, cette URL pourrait tomber sur la location du
            #   frontend et renvoyer du HTML a la place du JSON attendu.
            # - Le resultat cote UI serait alors un message du type
            #   "Unable to render this definition".
        location = /openapi.json {
            proxy_pass https://api_gateway_upstream/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # Route dediee au chat:
        # - cette sous-route recoit davantage de trafic legitime que le reste de
        #   l'API car elle transporte les messages temps reel.
        # - le buffering est coupe pour reduire la latence et garder un flux plus
        #   reactif entre le client et l'API gateway.
        location ^~ /api/chat/ {
            limit_conn conn_limit 500;
            limit_req zone=chat_limit burst=1000 nodelay;
            proxy_buffering off;
            proxy_read_timeout 300s;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass https://api_gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # API Gateway - toutes les requetes /api/
        # Cette location sert de route par defaut pour les endpoints REST du projet.
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass https://api_gateway_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Endpoints sensibles - rate limiting plus strict
        # Le but est de proteger les points de friction les plus exposes aux abus,
        # sans penaliser les routes d'information courantes comme `/api/auth/me`.
        location ~ ^/api/(auth/(login|register)|users/auth/register)$ {
            limit_req zone=login_limit burst=50 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass https://api_gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket pour le jeu et le chat temps reel
        # Ici on conserve la connexion ouverte afin de transmettre les evenements
        # sans re-negociation a chaque message.
        location /ws/ {
            proxy_pass https://api_gateway_upstream/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # Frontend - tout le reste
        # Tout ce qui n'est ni l'API ni le canal WebSocket est redirige vers le
        # frontend React/Vite.
        location / {
            modsecurity on;
            proxy_pass http://frontend_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self' ws: wss: https://api.cloudinary.com; font-src 'self';" always;
        }

        # Autoriser les dependances generees par Vite en mode developpement
        # Ces fichiers ne doivent pas etre bloques par ModSecurity car ils sont
        # produits par le bundler lui-meme et peuvent ressembler a du trafic atypique.
        location ^~ /node_modules/.vite/ {
            modsecurity off;
            proxy_pass http://frontend_upstream/node_modules/.vite/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Endpoints techniques Vite/HMR en dev (exclusions ciblees)
        # Ces routes sont utilitaires pour le hot reload. Elles sont exclues du
        # filtrage WAF pour eviter des faux positifs pendant le developpement local.
        location ^~ /@vite/ {
            modsecurity off;
            proxy_pass http://frontend_upstream/@vite/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /@react-refresh {
            modsecurity off;
            proxy_pass http://frontend_upstream/@react-refresh;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /src/ {
            modsecurity off;
            proxy_pass http://frontend_upstream/src/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Bloquer l'acces aux fichiers caches ou sensibles
        # Le motif `/.` vise les fichiers et repertoires caches de type `.env`,
        # `.git`, `.DS_Store`, etc. Le but est d'eviter toute exposition accidentelle.
        location ~ /\. {
            return 404;
        }

        # Reponse personnalisee lorsque le WAF bloque une requete
        # On renvoie du JSON pour que le frontend puisse afficher un message clair.
        error_page 403 /403.html;
        location = /403.html {
            internal;
            return 403 '{"error": "Request blocked by security policy"}';
            add_header Content-Type application/json;
        }

        # Reponse dediee au rate limiting
        # Le frontend peut exploiter ce JSON pour afficher un message explicite et
        # eventuellement retenter la requete apres delai.
        error_page 429 /429.json;
        location = /429.json {
            internal;
            add_header Content-Type application/json always;
            add_header Retry-After 60 always;
            return 429 '{"error":"Too many requests","detail":"Rate limit exceeded","retry_after":60}';
        }
    }
}

