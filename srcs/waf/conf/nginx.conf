load_module modules/ngx_http_modsecurity_module.so;

# -----------------------------------------------------------------------------
# FICHIER: nginx.conf (WAF)
#
# Rôle:
# - Ce conteneur "waf" (nginx + ModSecurity/OWASP CRS) est l'entrée unique exposée
#   vers l'hôte.
#
# Petit glossaire :
# - **WAF**: Web Application Firewall. Ici: ModSecurity + règles OWASP CRS.
#   Il analyse les requêtes et peut bloquer des patterns d'attaque (SQLi, XSS, etc.).
# - **Reverse proxy**: Nginx reçoit la requête puis la "forward" vers un autre service.
# - **Upstream**: groupe de serveurs backend (ici: `api-gateway`, `frontend`).
# - **DNS resolver**: permet à Nginx de re-trouver l'IP d'un service par son nom.
# - **Rate limit**: limite le nombre de requêtes par IP pour éviter brute-force/DDoS.
# - **Location**: règle de routage Nginx qui match une URL (`/api/`, regex, etc.).
#
# Liens avec docker-compose:
# - service "waf" publie:
#     - 8080:80  (HTTP)
#     - 8443:443 (HTTPS)
# - service "frontend" expose 3000 (Vite dev server, non publié directement)
# - service "api-gateway" expose 8000
#
# Routage appliqué ici:
# - /api/*  -> api-gateway:8000  (les routes FastAPI)
# - /ws/*   -> api-gateway:8000/ws/* (WebSockets)
# - /       -> frontend:3000 (React/Vite)
#
# Objectif principal:
# - Avoir une seule origine côté navigateur (http://localhost:8080),
#   et faire transiter l'API via /api/* pour éviter CORS.
# -----------------------------------------------------------------------------

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # -------------------------------------------------------------------------
    # 1) DNS dynamique (anti-502 après rebuild)
    # -------------------------------------------------------------------------
    # DNS / Résolution (point clé pour éviter les 502):
    # - Dans un réseau de conteneurs, les services (api-gateway, frontend) peuvent changer d'IP
    #   à chaque rebuild/recreate (`--build`, `--force-recreate`, crash/restart...).
    # - Par défaut, Nginx résout les hostnames au démarrage puis garde l'IP en cache.
    #   Conséquence classique: après recréation de `api-gateway`, Nginx continue d'appeler
    #   l'ancienne IP -> `502 Bad Gateway` / `Host is unreachable`.
    #
    # Solution appliquée:
    # - `resolver` + `upstream ... resolve;` => Nginx re-résout périodiquement les hostnames.
    # - `valid=10s` => durée de cache DNS interne de Nginx (il reconsulte le DNS après).
    #
    # Resolver list:
    # - 127.0.0.11 : DNS interne Docker (si vous lancez la stack avec Docker).
    # - 10.89.x.1  : DNS du réseau Podman (visible dans /etc/resolv.conf du conteneur).
    # Astuce: si tu ne sais pas quel DNS utiliser dans le conteneur,
    # regarde `/etc/resolv.conf` *dans* le conteneur `waf`.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 2s;

    upstream api_gateway_upstream {
        # `zone` = mémoire partagée pour stocker l'état de l'upstream (utile avec resolve/keepalive).
        zone api_gateway_upstream 64k;
        # `resolve` = Nginx re-résout le hostname régulièrement via `resolver`.
        server api-gateway:8000 resolve;
        # `keepalive` = garde des connexions ouvertes vers le backend (perf).
        keepalive 32;
    }

    upstream frontend_upstream {
        zone frontend_upstream 64k;
        server frontend:3000 resolve;
        keepalive 32;
    }

    proxy_ssl_server_name on;
    proxy_ssl_name api-gateway;
    proxy_ssl_trusted_certificate /certs/ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;

    # WebSockets 
    # - Un WebSocket commence comme une requête HTTP normale, puis "upgrade" la connexion.
    # - Si le client envoie `Upgrade: websocket`, il faut aussi envoyer `Connection: upgrade`.
    # - `map` permet de fabriquer proprement la valeur du header Connection.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Activer ModSecurity 
    # - `modsecurity on;` ici = actif partout par défaut.
    # - Ensuite, on peut faire des exceptions par `location` via `modsecurity off;`
    #   (typiquement pour Vite dev, sinon faux positifs).
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/setup.conf;

    # Note : ModSecurity est un module. Il prend la requête HTTP, la compare
    # aux règles OWASP CRS, et peut décider de bloquer (403) ou laisser passer.
    # En dev, certains assets Vite/HMR ressemblent à des payloads "bizarres" => faux positifs.
    # D'où les `modsecurity off;` ciblés sur `/@vite/`, `/src/`, etc.

    # Logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Rate Limiting - Protection contre DDoS/brute force 
    # - zone=api_limit: limite générale pour /api/
    # - zone=login_limit: plus strict pour les routes sensibles (login/register)
    #
    # Rappel rapide:
    # - `limit_req_zone` : définit une zone de comptage (par IP ici) + une vitesse.
    # - `limit_req`      : applique concrètement la zone dans une location.
    #
    # Unités:
    # - `10r/s` = 10 requêtes par seconde
    # - `5r/m`  = 5 requêtes par minute
    #
    # `zone=...:10m` = mémoire partagée allouée à cette table (10 MB).
    # `$binary_remote_addr` = IP du client en binaire (plus compact que `$remote_addr`).
    # -> on limite "par IP".
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=1000r/s;

    # Différence `limit_req` vs `limit_conn` (important):
    # - `limit_req` limite un *débit* (requêtes / seconde ou minute).
    # - `limit_conn` limite le *nombre de connexions simultanées*.
    #   Exemple: un client qui ouvre 200 connexions idle (attaque) -> limit_conn le calme.

    # Quand `limit_req` se déclenche, Nginx renvoie **503** par défaut
    # (souvent avec une page HTML). Pour une API, ce n'est pas idéal.
    #
    # Ce qu'on veut à la place:
    # - **429 Too Many Requests** : le code standard pour dire "tu as trop de requêtes"
    # - un **body JSON** : facile à parser côté frontend/clients
    # - un header **Retry-After** : indique en secondes quand réessayer
    #
    # Le body JSON est défini plus bas via `error_page 429` dans chaque `server {}`.
    limit_req_status 429;

    # Timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # Limites de taille
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Headers de sécurité globaux
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Cacher la version de Nginx
    server_tokens off;

   
    server {
        listen 80;
        server_name _;

        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host:8443$request_uri;
    }

    # -------------------------------------------------------------------------
    # Serveur HTTPS (8443 côté host -> 443 dans le conteneur)
    #
    # Pourquoi ça ne marchait pas avant ?
    # - docker-compose publie bien 8443:443, mais notre config n'avait qu'un
    #   `server { listen 80; }`.
    # - Résultat: le port 443 était bien exposé, mais Nginx ne parlait pas TLS dessus,
    #   donc le navigateur/curl voyait une "connection reset" pendant le handshake.
    #
    # Certificat:
    # - L'image owasp/modsecurity-crs génère un certificat auto-signé au démarrage.
    # - Chemins observés dans les logs: /etc/nginx/conf/server.crt et /etc/nginx/conf/server.key
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /certs/internal.crt;
        ssl_certificate_key /certs/internal.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # ici on termine TLS au niveau du WAF.
        # - le navigateur parle HTTPS avec le WAF
        # - le WAF parle HTTP (réseau interne) avec api-gateway/frontend

        limit_conn conn_limit 50;

        location /health {
            proxy_pass https://api_gateway_upstream/health;
        }

                # Swagger/OpenAPI support (FastAPI)
        # When accessing Swagger UI via `/api/docs`, FastAPI's template may still
        # reference the schema at `/openapi.json`. Without this mapping, `/openapi.json`
        # would hit the frontend location `/` and return HTML, causing:
        # "Unable to render this definition" in Swagger UI.
        location = /openapi.json {
            proxy_pass https://api_gateway_upstream/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        location ^~ /api/chat/ {
            limit_conn conn_limit 500;
            limit_req zone=chat_limit burst=1000 nodelay;
            proxy_buffering off;
            proxy_read_timeout 300s;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass https://api_gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # API Gateway - toutes les requêtes /api/
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass https://api_gateway_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Endpoints sensibles - rate limiting strict
        # On cible uniquement les endpoints réellement sensibles (évite de limiter /api/auth/me).
        location ~ ^/api/(auth/(login|register)|users/auth/register)$ {
            limit_req zone=login_limit burst=50 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass https://api_gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket pour le jeu/chat
        location /ws/ {
            proxy_pass https://api_gateway_upstream/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # Frontend - tout le reste
        location / {
            modsecurity on;
            proxy_pass http://frontend_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self' ws: wss: https://api.cloudinary.com; font-src 'self';" always;
        }

        # Autoriser les dépendances Vite en mode dev
        location ^~ /node_modules/.vite/ {
            modsecurity off;
            proxy_pass http://frontend_upstream/node_modules/.vite/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Endpoints techniques Vite/HMR en dev (exclusions ciblées)
        location ^~ /@vite/ {
            modsecurity off;
            proxy_pass http://frontend_upstream/@vite/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /@react-refresh {
            modsecurity off;
            proxy_pass http://frontend_upstream/@react-refresh;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /src/ {
            modsecurity off;
            proxy_pass http://frontend_upstream/src/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Bloquer l'accès aux fichiers sensibles
        location ~ /\. {
            return 404;
        }

        # Page d'erreur personnalisée pour les blocages WAF
        error_page 403 /403.html;
        location = /403.html {
            internal;
            return 403 '{"error": "Request blocked by security policy"}';
            add_header Content-Type application/json;
        }

        # Réponse rate-limit (API-friendly)
        error_page 429 /429.json;
        location = /429.json {
            internal;
            add_header Content-Type application/json always;
            add_header Retry-After 60 always;
            return 429 '{"error":"Too many requests","detail":"Rate limit exceeded","retry_after":60}';
        }
    }
}

