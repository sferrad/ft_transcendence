# Load the ModSecurity dynamic module
load_module modules/ngx_http_modsecurity_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Standard access log format
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # Extended WAF log format – includes upstream address for traceability
    log_format  waf   '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" upstream="$upstream_addr"';

    access_log  /var/log/nginx/access.log  waf;

    sendfile        on;
    keepalive_timeout  65;

    # Hide nginx version in error pages and Server header
    server_tokens  off;

    # Map HTTP Upgrade header to a connection value used by proxy_set_header.
    # Required for correct WebSocket pass-through (Vite HMR and app WS).
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    # ---------------------------------------------------------------
    # Upstreams
    # ---------------------------------------------------------------

    # React + Vite development server (port 5173 inside the container)
    upstream frontend {
        server frontend:5173;
    }

    # Python FastAPI API-Gateway
    upstream api_gateway {
        server api-gateway:8000;
    }

    # ---------------------------------------------------------------
    # Main virtual server – HTTP on port 80
    # ---------------------------------------------------------------
    server {
        listen  80;
        server_name  _;

        # -----------------------------------------------------------
        # ModSecurity – OWASP CRS in blocking mode
        # -----------------------------------------------------------
        modsecurity      on;
        modsecurity_rules_file /etc/modsecurity.d/include.conf;

        # -----------------------------------------------------------
        # Security response headers
        # -----------------------------------------------------------
        add_header  X-Frame-Options           "SAMEORIGIN"                   always;
        add_header  X-Content-Type-Options    "nosniff"                      always;
        add_header  X-XSS-Protection          "1; mode=block"                always;
        add_header  Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header  Permissions-Policy        "geolocation=(), microphone=()" always;

        # -----------------------------------------------------------
        # Helper: common proxy headers used by all locations
        # -----------------------------------------------------------
        proxy_set_header  Host               $host;
        proxy_set_header  X-Real-IP          $remote_addr;
        proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto  $scheme;

        # -----------------------------------------------------------
        # /api/ → API Gateway (REST)
        # -----------------------------------------------------------
        location /api/ {
            proxy_pass         http://api_gateway;
            proxy_read_timeout  90s;
            proxy_connect_timeout 30s;
            proxy_send_timeout  90s;

            # Do not expose backend errors to clients
            proxy_intercept_errors on;
            error_page 502 503 504 = @gateway_error;
        }

        # -----------------------------------------------------------
        # /ws/ → API Gateway (WebSocket)
        # Disable ModSecurity for WebSocket upgrade requests –
        # ModSecurity operates on HTTP, not WebSocket frames.
        # -----------------------------------------------------------
        location /ws/ {
            modsecurity  off;

            proxy_pass          http://api_gateway;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection $connection_upgrade;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # -----------------------------------------------------------
        # / → Frontend (React + Vite – includes Vite HMR WebSocket)
        # -----------------------------------------------------------
        location / {
            proxy_pass          http://frontend;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection $connection_upgrade;
            proxy_read_timeout  90s;
            proxy_connect_timeout 30s;
        }

        # -----------------------------------------------------------
        # Internal error page for upstream errors
        # -----------------------------------------------------------
        location @gateway_error {
            default_type application/json;
            return 502 '{"error":"Gateway unavailable"}';
        }
    }
}
