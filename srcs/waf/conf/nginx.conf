load_module modules/ngx_http_modsecurity_module.so;

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Access log with full request info
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Limit upload body size
    client_max_body_size 10m;

    # Hide nginx version from responses
    server_tokens off;

    # Security headers applied to all responses
    add_header X-Frame-Options          "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options   "nosniff"                       always;
    add_header X-XSS-Protection         "1; mode=block"                 always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none"                 always;
    add_header Permissions-Policy       "geolocation=(), microphone=()" always;

    # Enable ModSecurity with our include file
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/include.conf;

    # Upstream: React SPA
    upstream frontend_upstream {
        server frontend:3000;
    }

    # Upstream: FastAPI API Gateway
    upstream api_upstream {
        server api-gateway:8000;
    }

    # -----------------------------------------------------------------------
    # HTTP server
    # -----------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # WAF health check — ModSecurity disabled for this internal probe
        location /waf-health {
            access_log  off;
            modsecurity off;
            add_header  Content-Type text/plain;
            return 200  "WAF OK\n";
        }

        # API routes → api-gateway
        # Strip the /api prefix before forwarding
        location /api/ {
            proxy_pass          http://api_upstream/;
            proxy_http_version  1.1;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # WebSocket — real-time game via api-gateway
        location /ws/ {
            proxy_pass          http://api_upstream/ws/;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade           $http_upgrade;
            proxy_set_header    Connection        "upgrade";
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # All other traffic → React SPA
        location / {
            proxy_pass          http://frontend_upstream/;
            proxy_http_version  1.1;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }
    }
}
