# ===== ACTIVATION ModSecurity =====
# On = blocage actif | DetectionOnly = logs seulement
SecRuleEngine On

# ===== TRAITEMENT DES REQUÊTES =====
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# ===== TRAITEMENT DES RÉPONSES =====
SecResponseBodyAccess Off

# ===== LOGS D'AUDIT =====
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsecurity/audit.log

# ===== ACTIONS PAR DÉFAUT =====
SecDefaultAction "phase:1,deny,log,status:403"
SecDefaultAction "phase:2,deny,log,status:403"

# ===== RÈGLES PERSONNALISÉES =====

# Bloquer l'accès aux fichiers sensibles non couverts par CRS
SecRule REQUEST_FILENAME "@rx \.(env|git|htaccess|htpasswd)$" \
    "id:10004,phase:1,deny,status:403,log,msg:'Sensitive file access attempt'"
