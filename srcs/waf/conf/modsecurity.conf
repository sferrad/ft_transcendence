# =============================================================================
# ModSecurity configuration – ft_transcendence WAF
#
# SecRuleEngine On   → Blocking mode  (default)
# SecRuleEngine DetectionOnly → Detection-only mode (for tuning)
# SecRuleEngine Off  → Disabled (never use in production)
# =============================================================================

SecRuleEngine On

# -----------------------------------------------------------------------------
# Request body handling
# -----------------------------------------------------------------------------
SecRequestBodyAccess On

# Reject requests with bodies larger than 10 MB (file uploads handled separately)
SecRequestBodyLimit 10485760
SecRequestBodyNoFilesLimit 131072

# Action on exceeding the body limit (reject instead of silently truncating)
SecRequestBodyLimitAction Reject

# Maximum size for a single XML/JSON entity being inspected
SecXmlExternalEntity Off

# -----------------------------------------------------------------------------
# Response body handling
# -----------------------------------------------------------------------------
SecResponseBodyAccess On

# Only inspect specific MIME types
SecResponseBodyMimeType text/plain text/html text/xml application/json application/javascript

# Reject responses larger than 1 MB from being inspected
SecResponseBodyLimit 1048576
SecResponseBodyLimitAction ProcessPartial

# -----------------------------------------------------------------------------
# Temporary files and persistent data
# -----------------------------------------------------------------------------
SecTmpDir        /tmp/modsecurity
SecDataDir       /tmp/modsecurity

# Uploaded files are stored here when SecUploadKeepFiles is On
SecUploadDir     /tmp/modsecurity/upload
SecUploadKeepFiles Off

# -----------------------------------------------------------------------------
# Default action for phases 1 and 2
# deny with 403, log to both error log and audit log
# -----------------------------------------------------------------------------
SecDefaultAction "phase:1,log,auditlog,deny,status:403"
SecDefaultAction "phase:2,log,auditlog,deny,status:403"

# -----------------------------------------------------------------------------
# Audit logging
# -----------------------------------------------------------------------------

# Log relevant requests only (errors and blocked requests)
# Use "On" to log everything, "Off" to disable audit logging
SecAuditEngine RelevantOnly

# Which HTTP status codes trigger an audit log entry
SecAuditLogRelevantStatus "^(?:5|4(?!04))"

# Audit log parts:
#   A – Audit log header
#   B – Request headers
#   C – Request body
#   D – (reserved)
#   E – Intended response body (before ModSecurity modifications)
#   F – Response headers
#   H – Audit log trailer (rule matches, etc.)
#   I – Compact request body alternative to C
#   J – Uploaded files info
#   K – Full list of matched rules
#   Z – Final audit log boundary
SecAuditLogParts ABIJHZ

# Write all entries to a single serial file
SecAuditLogType  Serial
SecAuditLog      /var/log/modsecurity/audit.log

# JSON format for easier parsing by log collectors (ELK, Splunk, etc.)
SecAuditLogFormat JSON

# -----------------------------------------------------------------------------
# Debug logging (0 = off; increase to 9 for full verbosity during tuning)
# -----------------------------------------------------------------------------
SecDebugLog      /var/log/modsecurity/debug.log
SecDebugLogLevel 0

# -----------------------------------------------------------------------------
# HTTP argument / cookie parsing
# -----------------------------------------------------------------------------
SecArgumentSeparator  &
SecCookieFormat       0

# -----------------------------------------------------------------------------
# Unicode map (required by some CRS rules)
# The file is shipped with ModSecurity
# -----------------------------------------------------------------------------
SecUnicodeMapFile unicode.mapping 20127

# -----------------------------------------------------------------------------
# Allow ModSecurity to report its status to the project collectors
# (disable if you need strict outbound filtering)
# -----------------------------------------------------------------------------
SecStatusEngine On

# -----------------------------------------------------------------------------
# Collection timeout (session/IP collections persistence)
# -----------------------------------------------------------------------------
SecCollectionTimeout 600
