# =============================================================================
# FICHIER: modsecurity.conf (override)
#
# Ce fichier surcharge/complète la config ModSecurity fournie par l'image CRS.
# Objectif: activer le WAF, régler la taille des bodies, et configurer les logs.
#
# Mini-lexique :
# - ModSecurity analyse la requête en "phases".
#   - Phase 1: headers / URL
#   - Phase 2: body (JSON, form, multipart)
# - OWASP CRS ajoute des centaines de règles. Ici on règle surtout le "cadre".
# =============================================================================

# ===== ACTIVATION ModSecurity =====
# - On           : blocage actif (403)
# - DetectionOnly: ne bloque pas, écrit seulement dans les logs (utile au début)
SecRuleEngine On

# ===== TRAITEMENT DES REQUÊTES =====
# Autoriser ModSecurity à lire/analyser le body (POST JSON, form, upload...).
SecRequestBodyAccess On

# Taille max du body analysable.
# Ici: ~12.5MB (13,107,200 bytes). Doit être >= à `client_max_body_size` côté Nginx.
SecRequestBodyLimit 13107200

# Taille max du body hors fichiers (multipart sans le contenu binaire).
# Permet de limiter certaines attaques et d'éviter d'exploser la RAM.
SecRequestBodyNoFilesLimit 131072

# Comportement si le body dépasse les limites.
# - Reject = bloque direct (403)
# - ProcessPartial = analyse partiellement (moins strict)
SecRequestBodyLimitAction Reject

# ===== TRAITEMENT DES RÉPONSES =====
# Analyse de la réponse (rarement utile pour un petit projet, coûteux en perf).
SecResponseBodyAccess Off

# ===== LOGS D'AUDIT =====
# L'audit log est le fichier "forensic": quand ça bloque, tu viens ici.
#
# `RelevantOnly` = ne log que ce qui est intéressant (plutôt que TOUT).
SecAuditEngine RelevantOnly

# Quelles réponses déclenchent un audit log ?
# - 5xx: erreurs serveur
# - 4xx sauf 404 (très fréquent sur le web, bruit)
SecAuditLogRelevantStatus "^(?:5|4(?!04))"

# Quelles "parties" logguer (ABIJDEFHZ) ?
# - A: audit header
# - B: request headers
# - I: response headers
# - J: response body (si activé)
# - E/F/H/Z: métadonnées/règles/fin
# (On laisse la valeur de l'image CRS, c'est un bon compromis.)
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsecurity/audit.log

# ===== ACTIONS PAR DÉFAUT =====
# Action par défaut si une règle dit "deny".
# `phase:1` et `phase:2` couvrent URL/headers puis body.
SecDefaultAction "phase:1,deny,log,status:403"
SecDefaultAction "phase:2,deny,log,status:403"

# ===== RÈGLES PERSONNALISÉES =====
# Ici on peut ajouter de petites règles spécifiques à ton projet.

# Bloquer l'accès aux fichiers sensibles non couverts par CRS
# - `REQUEST_FILENAME` = le chemin demandé (ex: `/foo/.env` ou `/.git/config`)
# - `@rx` = regex
# - `id:10004` = identifiant unique (évite conflits avec CRS)
SecRule REQUEST_FILENAME "@rx (?:^|/)\.(?:git|svn|hg)(?:/|$)|\.(?:env|htaccess|htpasswd)$" \
    "id:10004,phase:1,deny,status:403,log,msg:'Sensitive file access attempt'"
