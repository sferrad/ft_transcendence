# =============================================================================
# ModSecurity Engine Configuration — ft_transcendence WAF
# Mode: BLOCKING (SecRuleEngine On)
# =============================================================================

# Enable the rule engine in full blocking mode.
# Detected attacks are blocked and logged.
# Change to "DetectionOnly" for passive monitoring without blocking.
SecRuleEngine On

# -------------------------------------------------------------------------
# Request body inspection
# -------------------------------------------------------------------------

# Inspect request bodies (POST/PUT/PATCH payloads)
SecRequestBodyAccess On

# Maximum allowed request body size (10 MB)
SecRequestBodyLimit 10485760

# In-memory limit for non-file request bodies (128 KB)
SecRequestBodyNoFilesLimit 131072
SecRequestBodyInMemoryLimit 131072

# Reject the request when the body size limit is exceeded
SecRequestBodyLimitAction Reject

# -------------------------------------------------------------------------
# Response body inspection
# -------------------------------------------------------------------------

# Inspect response bodies for data leakage detection
SecResponseBodyAccess On

# Only inspect these MIME types
SecResponseBodyMimeType text/plain text/html text/xml application/json

# Maximum response body to inspect (512 KB)
SecResponseBodyLimit 524288

# When the limit is exceeded, process what we have (do not block)
SecResponseBodyLimitAction ProcessPartial

# -------------------------------------------------------------------------
# File system paths
# -------------------------------------------------------------------------

SecTmpDir  /tmp/
SecDataDir /tmp/

# -------------------------------------------------------------------------
# File uploads
# -------------------------------------------------------------------------

SecUploadDir      /tmp/
SecUploadKeepFiles Off

# -------------------------------------------------------------------------
# Audit logging
# -------------------------------------------------------------------------

# Log only requests that triggered a rule or returned a 4xx/5xx status
SecAuditEngine        RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"

# Write all parts to a single serial log file
SecAuditLogType   Serial
SecAuditLog       /var/log/nginx/modsec_audit.log

# Log parts:
#   A = Audit log header
#   B = Request headers
#   C = Request body
#   E = Response body
#   F = Response headers
#   H = Audit log trailer (matched rules, etc.)
#   I = Compact request body (multipart decoded)
#   J = Uploaded file information
#   K = List of all matched rules
#   Z = Final boundary
SecAuditLogParts ABCEFHIJKZ

# -------------------------------------------------------------------------
# Debug logging — set level to 0 in production
# -------------------------------------------------------------------------

SecDebugLog      /var/log/nginx/modsec_debug.log
SecDebugLogLevel 0

# -------------------------------------------------------------------------
# Miscellaneous
# -------------------------------------------------------------------------

# Default action: log + pass (anomaly scoring rules will handle blocking)
SecDefaultAction "phase:1,log,auditlog,pass"

# PCRE match limits to prevent ReDoS
SecPcreMatchLimit          1000
SecPcreMatchLimitRecursion 1000

# Enable the status engine (exposes ModSecurity build information)
SecStatusEngine On

# Argument / field separators
SecArgumentSeparator &
SecCookieFormat      0

# Unicode map for normalisation rules
SecUnicodeMapFile unicode.mapping 20127
