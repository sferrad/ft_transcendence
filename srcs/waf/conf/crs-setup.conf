# =============================================================================
# FICHIER: crs-setup.conf (OWASP CRS tuning)
#
# Ce fichier configure OWASP Core Rule Set (CRS): c'est ici qu'on règle
# le niveau de paranoïa, les seuils d'anomalie, et quelques exclusions.
#
# Important :
# - CRS ne bloque pas "sur une règle unique" dans beaucoup de cas.
#   Il additionne un score (anomaly scoring). Si le score dépasse un seuil,
#   alors ça bloque.
# - Plus tu montes le `paranoia_level`, plus il y a de règles activées.
# =============================================================================

# ===== VERSION CRS (obligatoire, vérifié par la règle 901001) =====
SecAction \
    "id:900990,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:tx.crs_setup_version=330"

# ===== PARANOIA LEVEL =====
# 1 = basique, 2 = standard (souvent recommandé), 3 = strict, 4 = paranoïaque
# Ici on est en 3: plus strict -> plus de faux positifs possibles -> nécessite tuning.
SecAction \
    "id:900000,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:tx.paranoia_level=3"

# ===== SEUILS D'ANOMALIE =====
# Plus le seuil est bas, plus c'est strict.
#
# Ici on commence "haut" pour limiter les faux positifs avec paranoia 3:
# - inbound  = score max toléré côté requête
# - outbound = score max toléré côté réponse
#
# Si tu veux durcir ensuite: baisse progressivement (ex: 8/6 puis 5/4) en observant les logs.
SecAction \
    "id:900110,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:tx.inbound_anomaly_score_threshold=10,\
    setvar:tx.outbound_anomaly_score_threshold=7"

# ===== MODE ANOMALY SCORING =====
# Le niveau de paranoïa réellement appliqué côté blocage.
# En général, on le garde égal au `tx.paranoia_level`.
SecAction \
    "id:900100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:tx.blocking_paranoia_level=3"

# ===== APPLICATION SPÉCIFIQUE =====
# Déclarer les Content-Types autorisés 
# - CRS peut bloquer/score si un Content-Type est inattendu.
# - Ici on autorise explicitement `application/json` (important pour FastAPI).
# - Si tu envoies du form-encoded (`application/x-www-form-urlencoded`), c'est autorisé aussi,
#   mais ça peut déclencher plus facilement des faux positifs SQLi selon le payload.
SecAction \
    "id:900220,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json|'"

# ===== MÉTHODES HTTP AUTORISÉES =====
# Les méthodes acceptées par l'application. (Côté navigateur tu verras surtout GET/POST.)
SecAction \
    "id:900200,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# ===== EXTENSIONS DE FICHIERS BLOQUÉES =====
# Bloque des extensions "dangereuses" si ton appli sert des fichiers.
# Exemple: empêcher qu'un `.sql`, `.bak`, `.key` soit téléchargeable par accident.
SecAction \
    "id:900240,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.restricted_extensions=.asa/ .asax/ .ascx/ .backup/ .bak/ .bat/ .cdx/ .cer/ .cfg/ .cmd/ .com/ .config/ .conf/ .cs/ .csproj/ .csr/ .dat/ .db/ .dbf/ .dll/ .dos/ .htr/ .htw/ .ida/ .idc/ .idq/ .inc/ .ini/ .key/ .licx/ .lnk/ .log/ .mdb/ .old/ .pass/ .pdb/ .pol/ .printer/ .pwd/ .rdb/ .resources/ .resx/ .sql/ .swp/ .sys/ .vb/ .vbs/ .vbproj/ .vsdisco/ .webinfo/ .xsd/ .xsx/'"

# ===== HEADERS BLOQUÉS =====
# Bloque des headers rarement légitimes côté navigateur, et parfois utilisés en attaque.
SecAction \
    "id:900250,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.restricted_headers=/accept-charset/ /content-encoding/ /proxy/ /lock-token/ /content-range/ /if/'"

# ===== EXCLUSIONS POUR TON APPLICATION =====
# Exclure certaines URLs des vérifications (à ajuster selon tes besoins).
#
# Astuce debug :
# - Si un endpoint se fait bloquer, regarde `/var/log/modsecurity/audit.log`.
# - Tu verras souvent un `ruleId` (ex: 942100). Ensuite tu peux:
#   - soit baisser paranoïa/seuils
#   - soit exclure une règle pour une URL précise via `ctl:ruleRemoveById=...`

# Exclure le body check pour les uploads d'avatars
# - Un upload multipart peut être gros; analyser le binaire n'est pas utile et peut déclencher des faux positifs.
# - `ctl:requestBodyAccess=Off` coupe l'analyse du body uniquement pour cette URL.
SecRule REQUEST_URI "@beginsWith /api/profile/avatar" \
    "id:900901,phase:1,pass,t:none,nolog,ctl:requestBodyAccess=Off"

# Exclure les WebSockets des règles strictes
# - Certaines règles CRS prennent `Upgrade: websocket` pour des patterns suspects.
# - Ici on enlève une règle précise (920350) sur `/ws/`.
SecRule REQUEST_URI "@beginsWith /ws/" \
    "id:900902,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=920350"
