# =============================================================================
# OWASP CRS Setup – ft_transcendence
#
# Based on the official CRS 4.x crs-setup.conf template.
# Only the settings most relevant to this project are explicitly set here;
# everything else falls back to built-in CRS defaults.
# =============================================================================

# -----------------------------------------------------------------------------
# [SECTION 1]  Paranoia Level
#
# PL1 = Low false-positive rate    (recommended starting point)
# PL2 = More checks, some FPs      (tune before enabling in production)
# PL3 = High coverage, many FPs
# PL4 = Extreme coverage
# -----------------------------------------------------------------------------
SecAction \
  "id:900000, \
  phase:1, \
  nolog, \
  pass, \
  t:none, \
  setvar:tx.paranoia_level=1"

# Executing Paranoia Level – keep equal to or higher than paranoia_level
# (set higher to log but not block rules from the next PL)
SecAction \
  "id:900001, \
  phase:1, \
  nolog, \
  pass, \
  t:none, \
  setvar:tx.executing_paranoia_level=1"

# -----------------------------------------------------------------------------
# [SECTION 2]  Anomaly Scoring Thresholds
#
# Inbound (request) threshold: sum of rule scores before request is blocked.
# Outbound (response) threshold: sum of rule scores before response is blocked.
#
# Default CRS scores:
#   CRITICAL  → 5   HIGH → 4   MEDIUM → 3   NOTICE → 2
#
# Recommended starting values:
#   Inbound  = 5  (one CRITICAL hit or two HIGH hits)
#   Outbound = 4  (one HIGH hit)
# -----------------------------------------------------------------------------
SecAction \
  "id:900110, \
  phase:1, \
  nolog, \
  pass, \
  t:none, \
  setvar:tx.inbound_anomaly_score_threshold=5"

SecAction \
  "id:900120, \
  phase:1, \
  nolog, \
  pass, \
  t:none, \
  setvar:tx.outbound_anomaly_score_threshold=4"

# -----------------------------------------------------------------------------
# [SECTION 3]  Early Blocking
#
# When enabled, the engine blocks the request as soon as the anomaly threshold
# is reached within a phase rather than waiting until all rules have run.
# Improves performance when a request is clearly malicious.
# -----------------------------------------------------------------------------
SecAction \
  "id:900022, \
  phase:1, \
  nolog, \
  pass, \
  t:none, \
  setvar:tx.early_blocking=1"

# -----------------------------------------------------------------------------
# [SECTION 4]  Allowed HTTP Methods
#
# Extend the default list to include all methods used by the REST API.
# -----------------------------------------------------------------------------
SecAction \
  "id:900200, \
  phase:1, \
  nolog, \
  pass, \
  t:none, \
  setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# -----------------------------------------------------------------------------
# [SECTION 5]  Allowed Request Content-Types
#
# application/json and multipart/form-data (profile picture uploads) are
# required in addition to the defaults.
# -----------------------------------------------------------------------------
SecAction \
  "id:900220, \
  phase:1, \
  nolog, \
  pass, \
  t:none, \
  setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/octet-stream| |application/csp-report| |text/plain|'"

# Content-type charset allowed alongside the above MIME types
SecAction \
  "id:900270, \
  phase:1, \
  nolog, \
  pass, \
  t:none, \
  setvar:'tx.allowed_request_content_type_charset=utf-8|iso-8859-1|iso-8859-15|windows-1252'"

# -----------------------------------------------------------------------------
# [SECTION 6]  Allowed HTTP Versions
# -----------------------------------------------------------------------------
SecAction \
  "id:900230, \
  phase:1, \
  nolog, \
  pass, \
  t:none, \
  setvar:'tx.allowed_http_versions=HTTP/1.0 HTTP/1.1 HTTP/2 HTTP/2.0'"

# -----------------------------------------------------------------------------
# [SECTION 7]  Restricted File Extensions
#
# Block direct requests for files with sensitive extensions.
# -----------------------------------------------------------------------------
SecAction \
  "id:900240, \
  phase:1, \
  nolog, \
  pass, \
  t:none, \
  setvar:'tx.restricted_extensions=.asa/ .asax/ .ascx/ .axd/ .backup/ .bak/ .bat/ .cdx/ .cer/ .cfg/ .cmd/ .com/ .config/ .conf/ .cs/ .csproj/ .csr/ .dat/ .db/ .dbf/ .dll/ .dos/ .htr/ .htw/ .ida/ .idc/ .idq/ .inc/ .ini/ .key/ .licx/ .lnk/ .log/ .mdb/ .old/ .pass/ .pdb/ .pol/ .printer/ .pwd/ .rdb/ .resources/ .resx/ .sql/ .swp/ .sys/ .vb/ .vbs/ .vbproj/ .vsdisco/ .webinfo/ .xsd/ .xsx/'"

# -----------------------------------------------------------------------------
# [SECTION 8]  Restricted Request Headers
# -----------------------------------------------------------------------------
SecAction \
  "id:900250, \
  phase:1, \
  nolog, \
  pass, \
  t:none, \
  setvar:'tx.restricted_headers_basic=/proxy/ /lock-token/ /content-range/ /if/'"

SecAction \
  "id:900255, \
  phase:1, \
  nolog, \
  pass, \
  t:none, \
  setvar:'tx.restricted_headers_extended=/content-encoding/ /proxy/ /lock-token/ /content-range/ /if/ /x-http-method-override/ /x-http-method/ /x-method-override/'"

# -----------------------------------------------------------------------------
# [SECTION 9]  Static Extensions (bypass CRS inspection for static files)
#
# These are served by the Vite dev server / frontend and do not need WAF
# inspection for most rule sets.  CRS rules that reference
# tx.static_extensions will skip processing for these extensions.
# -----------------------------------------------------------------------------
SecAction \
  "id:900990, \
  phase:1, \
  nolog, \
  pass, \
  t:none, \
  setvar:'tx.static_extensions=/.jpg/ /.jpeg/ /.png/ /.gif/ /.webp/ /.svg/ /.ico/ /.css/ /.js/ /.mjs/ /.woff/ /.woff2/ /.ttf/ /.eot/ /.otf/ /.mp4/ /.webm/'"

# -----------------------------------------------------------------------------
# [SECTION 10]  Argument / Upload Limits
# -----------------------------------------------------------------------------

# Maximum number of query-string or body arguments
SecAction \
  "id:900300, \
  phase:1, \
  nolog, \
  pass, \
  t:none, \
  setvar:tx.max_num_args=255"

# Maximum length of a single argument name (bytes)
SecAction \
  "id:900310, \
  phase:1, \
  nolog, \
  pass, \
  t:none, \
  setvar:tx.arg_name_length=100"

# Maximum length of a single argument value (bytes)
SecAction \
  "id:900320, \
  phase:1, \
  nolog, \
  pass, \
  t:none, \
  setvar:tx.arg_length=400"

# Maximum total combined argument length (bytes)
SecAction \
  "id:900330, \
  phase:1, \
  nolog, \
  pass, \
  t:none, \
  setvar:tx.total_arg_length=64000"

# Maximum size of a single uploaded file (bytes) – 5 MB
SecAction \
  "id:900340, \
  phase:1, \
  nolog, \
  pass, \
  t:none, \
  setvar:tx.max_file_size=5242880"

# Maximum total size of all uploaded files (bytes) – 10 MB
SecAction \
  "id:900350, \
  phase:1, \
  nolog, \
  pass, \
  t:none, \
  setvar:tx.combined_file_sizes=10485760"

# -----------------------------------------------------------------------------
# [SECTION 11]  Sampling Percentage (100 = inspect all requests)
# -----------------------------------------------------------------------------
SecAction \
  "id:900400, \
  phase:1, \
  nolog, \
  pass, \
  t:none, \
  setvar:tx.sampling_percentage=100"

# -----------------------------------------------------------------------------
# End of crs-setup.conf
# -----------------------------------------------------------------------------
