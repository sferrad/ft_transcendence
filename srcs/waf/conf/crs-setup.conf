# =============================================================================
# OWASP CRS Setup — ft_transcendence WAF
# Based on OWASP Core Rule Set v4.x
# =============================================================================

# -----------------------------------------------------------------------
# PARANOIA LEVEL
# -----------------------------------------------------------------------
# PL1 — Default. Minimal false positives, recommended for production.
# PL2 — More rules, small increase in false positives.
# PL3 — Stricter rules, noticeable false positives.
# PL4 — Maximum security, high false-positive rate.
SecAction \
    "id:900000,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.paranoia_level=1"

# Executing paranoia level (can be set higher than the detection level)
SecAction \
    "id:900001,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.executing_paranoia_level=1"

# -----------------------------------------------------------------------
# ANOMALY SCORING THRESHOLDS
# -----------------------------------------------------------------------
# Requests are blocked when their accumulated anomaly score reaches these
# thresholds.
#   Critical hit  = 5 points
#   Error hit     = 4 points
#   Warning hit   = 3 points
#   Notice hit    = 2 points
SecAction \
    "id:900110,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"

# -----------------------------------------------------------------------
# HTTP POLICY — ALLOWED METHODS
# -----------------------------------------------------------------------
SecAction \
    "id:900200,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# -----------------------------------------------------------------------
# HTTP POLICY — ALLOWED REQUEST CONTENT TYPES
# -----------------------------------------------------------------------
SecAction \
    "id:900220,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |application/json| |application/xml| |text/xml| |text/plain|'"

# -----------------------------------------------------------------------
# HTTP POLICY — ALLOWED HTTP VERSIONS
# -----------------------------------------------------------------------
SecAction \
    "id:900230,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_http_versions=HTTP/1.0 HTTP/1.1 HTTP/2 HTTP/2.0'"

# -----------------------------------------------------------------------
# HTTP POLICY — RESTRICTED FILE EXTENSIONS
# -----------------------------------------------------------------------
SecAction \
    "id:900240,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.restricted_extensions=.asa/ .asax/ .ascx/ .backup/ .bak/ .bat/ .cfg/ .cmd/ .com/ .config/ .conf/ .cs/ .db/ .dll/ .dos/ .ini/ .key/ .log/ .mdb/ .old/ .pass/ .pdb/ .sql/ .swp/ .sys/ .vbs/'"

# -----------------------------------------------------------------------
# HTTP POLICY — RESTRICTED REQUEST HEADERS
# -----------------------------------------------------------------------
SecAction \
    "id:900250,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.restricted_headers_basic=/accept-charset/ /content-encoding/ /proxy/ /lock-token/ /content-range/ /if/'"

# -----------------------------------------------------------------------
# ARGUMENT LIMITS
# -----------------------------------------------------------------------
# Maximum number of request arguments
SecAction \
    "id:900300,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.max_num_args=255"

# Maximum length of an argument name
SecAction \
    "id:900310,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.arg_name_length=100"

# Maximum length of an argument value
SecAction \
    "id:900320,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.arg_length=400"

# Maximum total length of all arguments combined
SecAction \
    "id:900330,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.total_arg_length=64000"

# -----------------------------------------------------------------------
# FILE UPLOAD LIMITS
# -----------------------------------------------------------------------
# Maximum size of an individual uploaded file (1 MB)
SecAction \
    "id:900340,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.max_file_size=1048576"

# Maximum combined file upload size (1 MB)
SecAction \
    "id:900350,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.combined_file_sizes=1048576"
