# ===== PARANOIA LEVEL =====
# 1 = basique, 2 = standard (recommandé), 3 = strict, 4 = paranoïaque
SecAction \
    "id:900000,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:tx.paranoia_level=3"

# ===== SEUILS D'ANOMALIE =====
# Plus le seuil est bas, plus c'est strict
# Paranoia 3 : commencer haut (10/7) pour éviter les faux positifs, baisser après tuning
SecAction \
    "id:900110,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:tx.inbound_anomaly_score_threshold=10,\
    setvar:tx.outbound_anomaly_score_threshold=7"

# ===== MODE ANOMALY SCORING =====
SecAction \
    "id:900100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:tx.blocking_paranoia_level=3"

# ===== APPLICATION SPÉCIFIQUE =====
# Déclarer les Content-Types autorisés
SecAction \
    "id:900220,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json|'"

# ===== MÉTHODES HTTP AUTORISÉES =====
SecAction \
    "id:900200,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# ===== EXTENSIONS DE FICHIERS BLOQUÉES =====
SecAction \
    "id:900240,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.restricted_extensions=.asa/ .asax/ .ascx/ .backup/ .bak/ .bat/ .cdx/ .cer/ .cfg/ .cmd/ .com/ .config/ .conf/ .cs/ .csproj/ .csr/ .dat/ .db/ .dbf/ .dll/ .dos/ .htr/ .htw/ .ida/ .idc/ .idq/ .inc/ .ini/ .key/ .licx/ .lnk/ .log/ .mdb/ .old/ .pass/ .pdb/ .pol/ .printer/ .pwd/ .rdb/ .resources/ .resx/ .sql/ .swp/ .sys/ .vb/ .vbs/ .vbproj/ .vsdisco/ .webinfo/ .xsd/ .xsx/'"

# ===== HEADERS BLOQUÉS =====
SecAction \
    "id:900250,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.restricted_headers=/accept-charset/ /content-encoding/ /proxy/ /lock-token/ /content-range/ /if/'"

# ===== EXCLUSIONS POUR TON APPLICATION =====
# Exclure certaines URLs des vérifications (à ajuster selon tes besoins)

# Exclure le body check pour les uploads d'avatars
SecRule REQUEST_URI "@beginsWith /api/profile/avatar" \
    "id:900901,phase:1,pass,t:none,nolog,ctl:requestBodyAccess=Off"

# Exclure les WebSockets des règles strictes
SecRule REQUEST_URI "@beginsWith /ws/" \
    "id:900902,phase:1,pass,t:none,nolog,ctl:ruleRemoveById=920350"
