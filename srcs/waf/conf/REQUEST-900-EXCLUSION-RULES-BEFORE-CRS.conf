# =============================================================================
# PROJECT-SPECIFIC EXCLUSION RULES – loaded BEFORE CRS rules
#
# Use this file to disable or tune CRS rules that generate false positives
# for ft_transcendence endpoints.  Exclusions added here run in phase:1 so
# they affect the entire request lifecycle.
#
# Rule-ID range reserved for local rules: 9001000–9001999
# =============================================================================

# -----------------------------------------------------------------------------
# Authentication endpoints
#
# The JWT Bearer token in the Authorization header may trigger rule 920272
# (restricted characters in the header).  Exclude that header value from the
# check so legitimate logins are not blocked.
# -----------------------------------------------------------------------------
SecRuleUpdateTargetById 920272 "!REQUEST_HEADERS:Authorization"

# -----------------------------------------------------------------------------
# WebSocket upgrade handshake
#
# Requests with Upgrade: websocket are routed by nginx to a location block
# that has modsecurity off.  The rule below is a belt-and-suspenders guard
# so CRS rules that flag the Upgrade header do not trip in phase:1 before
# the per-location directive takes effect.
# -----------------------------------------------------------------------------
SecRule REQUEST_HEADERS:Upgrade "@streq websocket" \
  "id:9001001, \
  phase:1, \
  pass, \
  nolog, \
  t:lowercase, \
  ctl:ruleRemoveById=920272, \
  ctl:ruleRemoveById=920300"

# -----------------------------------------------------------------------------
# Profile picture upload endpoint – /api/profile/avatar
#
# Multipart uploads with binary data will naturally score high on several
# CRS rules.  Relax argument-length and content-type checks for this path
# only; the hard limits set in crs-setup.conf still apply.
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /api/profile/avatar" \
  "id:9001002, \
  phase:1, \
  pass, \
  nolog, \
  t:none, \
  ctl:ruleRemoveById=200002, \
  ctl:ruleRemoveById=200003"

# -----------------------------------------------------------------------------
# Health-check probes
#
# Internal Docker health-check requests to /health never contain user-supplied
# data; skip CRS inspection entirely for these short-lived probes.
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@streq /health" \
  "id:9001003, \
  phase:1, \
  pass, \
  nolog, \
  t:none, \
  ctl:ruleEngine=Off"
