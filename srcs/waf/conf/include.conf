# =============================================================================
# ModSecurity Include File — ft_transcendence WAF
#
# Load order matters:
#   1. Engine configuration (modsecurity.conf)
#   2. CRS setup / variables (crs-setup.conf)  ← must come before rules
#   3. OWASP CRS rules (rules/*.conf)
#   4. Project-specific exclusions (custom-exclusions.conf)  ← after rules
# =============================================================================

Include /etc/modsecurity.d/modsecurity.conf
Include /etc/modsecurity.d/crs-setup.conf
Include /etc/modsecurity.d/owasp-crs/rules/*.conf
Include /etc/modsecurity.d/custom-exclusions.conf
