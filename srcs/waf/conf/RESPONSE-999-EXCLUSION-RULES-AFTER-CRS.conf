# =============================================================================
# PROJECT-SPECIFIC EXCLUSION RULES – loaded AFTER CRS rules
#
# Use this file for response-side exclusions or to remove false positives
# that only manifest in the response inspection phase.
#
# Rule-ID range reserved for local rules: 9002000–9002999
# =============================================================================

# -----------------------------------------------------------------------------
# JSON API responses
#
# The API gateway returns JSON bodies that may contain user-generated content
# (e.g. chat messages, usernames).  Rule 953130 flags JavaScript-like patterns
# in response bodies; exclude the api-gateway upstream responses from it to
# avoid blocking legitimate chat payloads.
# -----------------------------------------------------------------------------
SecRule RESPONSE_HEADERS:Content-Type "@contains application/json" \
  "id:9002001, \
  phase:3, \
  pass, \
  nolog, \
  t:none, \
  ctl:ruleRemoveById=953130"

# -----------------------------------------------------------------------------
# Vite HMR development response headers
#
# The Vite development server emits EventSource / SSE responses for Hot Module
# Replacement.  Their Content-Type (text/event-stream) can trigger outbound
# data-leakage rules.  Exclude HMR paths from response inspection so that
# developers are not blocked during local work.
# -----------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /@vite" \
  "id:9002002, \
  phase:3, \
  pass, \
  nolog, \
  t:none, \
  ctl:ruleEngine=Off"

SecRule REQUEST_URI "@beginsWith /__vite" \
  "id:9002003, \
  phase:3, \
  pass, \
  nolog, \
  t:none, \
  ctl:ruleEngine=Off"
