version: '3.8'

## NETWORKS ####

networks:
  transcendence-frontend:
    name: transcendence-frontend
    driver: bridge
  transcendence-backend:
    name: transcendence-backend
    driver: bridge
  transcendence-database:
    name: transcendence-database
    driver: bridge


## VOLUMES ####


volumes:
  vault-data:
  user-db:
  chat-db:
  friends-db:
  game-db:
  analytics-db:
  profile-db:



## DATABASES ####

services:
  user-db:
    build:
      context: ./postgres-databases
      dockerfile: Dockerfile
    expose:
      - 5432
    image: user-db
    env_file:
      - .env
    environment:
      - POSTGRES_DB=user_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - user-db:/var/lib/postgresql/data
    networks:
      - transcendence-database
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  chat-db:
    build:
      context: ./postgres-databases
      dockerfile: Dockerfile
    expose:
