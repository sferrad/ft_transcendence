    depends_on:
      friends-db:
        condition: service-healthy
      vault:
        condition: service-healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"] ## Route a ajouter dans le main.py
      interval: 30s
