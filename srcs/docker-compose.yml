## FRONTEND ####

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend-react
    ports:
      - "3000:3000"
    networks:
      - transcendence-frontend
    restart: unless-stopped

## WAF ####

  WAF:
    build:
      context: ./waf
      dockerfile: Dockerfile
    image: WAF
    ports:
      - "80:80"
      - "443:443"
    networks:
      - transcendence-frontend
    depends_on:
      api-gateway:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
