  profile-db:
    build:
      context: ./postgres-postgres-databases/profile-db
      dockerfile: Dockerfile
    image: profile-db
    env_file:
      - .env
    environment:
      - POSTGRES_DB=profile_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
