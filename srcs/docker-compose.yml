## SECRETS ####

  vault:
    build:
      context: ./vault
      dockerfile: Dockerfile
    image: vault
    env_file:
      - .env
    expose:
      - "8200"
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
    volumes:
      - vault-data:/vault/data
    cap_add:
      - IPC_LOCK
    networks:
      - transcendence-backend
    restart: unless-stopped
    depends_on:
      user-db:
        condition: service_healthy
      chat-db:
        condition: service_healthy
      friends-db:
        condition: service_healthy
      game-db:
        condition: service_healthy
      analytics-db:
        condition: service_healthy
      profile-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


## MICRO SERVICES ####

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    image: api-gateway
    environment:
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN_FILE=/vault/data/api-gateway.token
      - JWT_SECRET_KEY=${JWT_SECRET_KEY} ## a generer avec openssl rand -hex 32
    expose:
      - "8000"
    volumes:
      - vault-data:/vault/data:ro 
    networks:
      - transcendence-backend
      - transcendence-frontend
    depends_on:
      vault:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"] ## Route a ajouter dans le main.py
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    image: user-service
    env_file:
      - .env
    environment:
      - USER_SERVICE_URL=http://user-service:8001
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN_FILE=/vault/data/api-user.token
      - DB_HOST=user-db
      - DB_PORT=${DB_PORT}
      - DB_NAME=user_db
      - VAULT_DB_CREDS_PATH=database/creds/user-role # credentials tmp pour acces DB accessible avec vault token
    expose:
      - "8001"
    volumes:
      - vault-data:/vault/data:ro 
    networks:
      - transcendence-backend
      - transcendence-database
    depends_on:
      user-db:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"] ## Route a ajouter dans le main.py
