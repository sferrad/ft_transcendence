version: '3.8'

## NETWORKS ####

networks:
  transcendence-frontend:
    name: transcendence-frontend
    driver: bridge
  transcendence-backend:
    name: transcendence-backend
    driver: bridge
  transcendence-database:
    name: transcendence-database
    driver: bridge


## VOLUMES ####


volumes:
  vault-data:
  user-db:
  chat-db:
  friends-db:
  game-db:
  analytics-db:
  profile-db:



## DATABASES ####

services:
  user-db:
    build:
      context: ./postgres-postgres-databases/user-db
      dockerfile: Dockerfile
    image: user-db
    env_file:
      - .env
    environment:
      - POSTGRES_DB=user_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - user-db:/var/lib/postgresql/data
    networks:
      - transcendence-database
    restart: unless_stopped
    healthcheck:
      # test: ["executable", "arg"] a definir
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  chat-db:
    build:
      context: ./postgres-postgres-databases/chat-db
      dockerfile: Dockerfile
    image: chat-db
    env_file:
      - .env
    environment:
      - POSTGRES_DB=chat_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - chat-db:/var/lib/postgresql/data
    networks:
      - transcendence-database
    restart: unless_stopped
    healthcheck:
      # test: ["executable", "arg"] a definir
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  friends-db:
    build:
      context: ./postgres-postgres-databases/friends-db
      dockerfile: Dockerfile
    image: friends-db
    env_file:
      - .env
    environment:
      - POSTGRES_DB=friends_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - friends-db:/var/lib/postgresql/data
    networks:
      - transcendence-database
    restart: unless_stopped
    healthcheck:
      # test: ["executable", "arg"] a definir
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  game-db:
    build:
      context: ./postgres-postgres-databases/game-db
      dockerfile: Dockerfile
    image: game-db
    env_file:
      - .env
    environment:
      - POSTGRES_DB=game_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - game-db:/var/lib/postgresql/data
    networks:
      - transcendence-database
    restart: unless_stopped
    healthcheck:
      # test: ["executable", "arg"] a definir
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  analytics-db:
    build:
      context: ./postgres-postgres-databases/analytics-db
      dockerfile: Dockerfile
    image: analytics-db
    env_file:
      - .env
    environment:
      - POSTGRES_DB=analytics_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - analytics-db:/var/lib/postgresql/data
    networks:
      - transcendence-database
    restart: unless_stopped
