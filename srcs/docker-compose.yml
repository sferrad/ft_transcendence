version: '3.8'

## EXTENSION FIELDS ####

x-postgres-base: &postgres-base
  build:
    context: ./postgres-databases
    dockerfile: Dockerfile
  expose:
    - "5432"
  env_file:
    - .env
  networks:
    - transcendence-database
  restart: unless-stopped

x-hc-fast: &hc-fast
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 5s

x-hc-service: &hc-service
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 15s

## NETWORKS ####

networks:
  transcendence-frontend:
    driver: bridge
  transcendence-edge:
    driver: bridge
  transcendence-backend:
    driver: bridge
  transcendence-database:
    driver: bridge

## VOLUMES ####

volumes:
  user-db:
  chat-db:
  friends-db:
  game-db:
  profile-db:
  vault-data:
  vault-private:
  vault-logs:
  vault-file:
  grafana-data:
  alertmanager-data:
  avatar-profile-service:
  node_modules-frontend:
  redis-data:
  prometheus-data:
  alertmanager-data-extra:

## DATABASES ####

services:
  user-db:
    <<: *postgres-base
    image: user-db
    environment:
      - POSTGRES_DB=user_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - user-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d user_db"]
      <<: *hc-fast

  chat-db:
    <<: *postgres-base
    image: chat-db
    environment:
      - POSTGRES_DB=chat_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - chat-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d chat_db"]
      <<: *hc-fast

  friends-db:
    <<: *postgres-base
    image: friends-db
    environment:
      - POSTGRES_DB=friends_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - friends-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d friends_db"]
      <<: *hc-fast

  game-db:
    <<: *postgres-base
    image: game-db
    environment:
      - POSTGRES_DB=game_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - game-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d game_db"]
      <<: *hc-fast

  profile-db:
    <<: *postgres-base
    image: profile-db
    environment:
      - POSTGRES_DB=profile_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - profile-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d profile_db"]
      <<: *hc-fast

  ## SECRETS ####

  vault:
    build:
      context: ./vault
      dockerfile: Dockerfile
    image: vault
    user: "0:0"
    env_file:
      - .env
    expose:
      - "8200"
    environment:
      - VAULT_ADDR=https://vault:8200
      - VAULT_CACERT=/certs/ca.crt
    volumes:
      - vault-data:/vault/data
      - vault-private:/vault/private
      - vault-logs:/vault/logs
      - vault-file:/vault/file
      - ./certs/internal:/certs:ro
    cap_add:
      - IPC_LOCK
    networks:
      - transcendence-backend
      - transcendence-database
    restart: unless-stopped
    depends_on:
      user-db:
        condition: service_healthy
      chat-db:
        condition: service_healthy
      friends-db:
        condition: service_healthy
      game-db:
        condition: service_healthy
      profile-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "vault", "status"]
      <<: *hc-fast

  ## MICRO SERVICES ####

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    image: api-gateway
    environment:
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN_FILE=/vault/data/api-gateway.token
      - VAULT_CA_CERT=/certs/ca.crt
      - INTERNAL_CA_CERT=/certs/ca.crt
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHAT_SERVICE_URL=https://chat-service:8002
      - GAME_SERVICE_URL=https://game-service:8005
    expose:
      - "8000"
    volumes:
      - vault-data:/vault/data:ro
      - ./certs/internal:/certs:ro
    networks:
      - transcendence-backend
      - transcendence-edge
    depends_on:
      vault:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--cacert", "/certs/ca.crt", "https://localhost:8000/health"]
      <<: *hc-service

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    image: user-service
    env_file:
      - .env
    environment:
      - USER_SERVICE_URL=https://user-service:8001
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN_FILE=/vault/data/api-user.token
      - VAULT_CA_CERT=/certs/ca.crt
      - INTERNAL_CA_CERT=/certs/ca.crt
      - DB_HOST=user-db
      - DB_PORT=${DB_PORT}
      - DB_NAME=user_db
      - VAULT_DB_CREDS_PATH=database/creds/user-role
    expose:
      - "8001"
    volumes:
      - vault-data:/vault/data:ro
      - ./certs/internal:/certs:ro
    networks:
      - transcendence-backend
      - transcendence-database
    depends_on:
      user-db:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--cacert", "/certs/ca.crt", "https://localhost:8001/health"]
      <<: *hc-service

  chat-service:
    build:
      context: ./backend/chat-service
      dockerfile: Dockerfile
    image: chat-service
    env_file:
      - .env
    environment:
      - CHAT_SERVICE_URL=https://chat-service:8002
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN_FILE=/vault/data/api-chat.token
      - VAULT_CA_CERT=/certs/ca.crt
      - INTERNAL_CA_CERT=/certs/ca.crt
      - DB_HOST=chat-db
      - DB_PORT=${DB_PORT}
      - DB_NAME=chat_db
      - VAULT_DB_CREDS_PATH=database/creds/chat-role
    expose:
      - "8002"
    volumes:
      - vault-data:/vault/data:ro
      - ./certs/internal:/certs:ro
    networks:
      - transcendence-backend
      - transcendence-database
    depends_on:
      chat-db:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--cacert", "/certs/ca.crt", "https://localhost:8002/health"]
      <<: *hc-service

  friends-service:
    build:
      context: ./backend/friends-service
      dockerfile: Dockerfile
    image: friends-service
    env_file:
      - .env
    environment:
      - FRIENDS_SERVICE_URL=https://friends-service:8004
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN_FILE=/vault/data/api-friends.token
      - VAULT_CA_CERT=/certs/ca.crt
      - INTERNAL_CA_CERT=/certs/ca.crt
      - DB_HOST=friends-db
      - DB_PORT=${DB_PORT}
      - DB_NAME=friends_db
      - VAULT_DB_CREDS_PATH=database/creds/friends-role
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PRESENCE_TTL_SECONDS=45
    expose:
      - "8004"
    volumes:
      - vault-data:/vault/data:ro
      - ./certs/internal:/certs:ro
    networks:
      - transcendence-backend
      - transcendence-database
    depends_on:
      friends-db:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--cacert", "/certs/ca.crt", "https://localhost:8004/health"]
      <<: *hc-service

  game-service:
    build:
      context: ./backend/game-service
      dockerfile: Dockerfile
    image: game-service
    env_file:
      - .env
    environment:
      - GAME_SERVICE_URL=https://game-service:8005
      - FRIENDS_SERVICE_URL=https://friends-service:8004
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN_FILE=/vault/data/api-game.token
      - VAULT_CA_CERT=/certs/ca.crt
      - INTERNAL_CA_CERT=/certs/ca.crt
      - DB_HOST=game-db
      - DB_PORT=${DB_PORT}
      - DB_NAME=game_db
      - VAULT_DB_CREDS_PATH=database/creds/game-role
    expose:
      - "8005"
    volumes:
      - vault-data:/vault/data:ro
      - ./certs/internal:/certs:ro
    networks:
      - transcendence-backend
      - transcendence-database
    depends_on:
      game-db:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--cacert", "/certs/ca.crt", "https://localhost:8005/health"]
      <<: *hc-service

  mailhog:
    build:
      context: ./backend/mailhog
      dockerfile: Dockerfile
    image: mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped
    networks:
      - transcendence-backend

  profile-service:
    build:
      context: ./backend/profile-service
      dockerfile: Dockerfile
    image: profile-service
    env_file:
      - .env
    environment:
      - PROFILE_SERVICE_URL=https://profile-service:8006
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN_FILE=/vault/data/api-profile.token
      - VAULT_CA_CERT=/certs/ca.crt
      - INTERNAL_CA_CERT=/certs/ca.crt
      - DB_HOST=profile-db
      - DB_PORT=${DB_PORT}
      - DB_NAME=profile_db
      - VAULT_DB_CREDS_PATH=database/creds/profile-role
      - AVATAR_UPLOAD_DIR=/app/uploads/avatars
      - MAIL_SERVER=mailhog
      - MAIL_PORT=1025
      - MAIL_FROM=noreply@team42.com
    expose:
      - "8006"
    volumes:
      - vault-data:/vault/data:ro
      - avatar-profile-service:/app/uploads
      - ./certs/internal:/certs:ro
    networks:
      - transcendence-backend
      - transcendence-database
    depends_on:
      profile-db:
        condition: service_healthy
      vault:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--cacert", "/certs/ca.crt", "https://localhost:8006/health"]
      <<: *hc-service

  ## FRONTEND ####

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend-react
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_DEV_PROXY_TARGET=http://waf
    volumes:
      - ./frontend:/app
      - node_modules-frontend:/app/node_modules
    expose:
      - "3000"
    networks:
      - transcendence-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  ## WAF ####

  waf:
    build:
      context: ./waf
      dockerfile: Dockerfile
    image: waf
    user: "0:0"
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./certs/internal:/certs:ro
    networks:
      - transcendence-frontend
      - transcendence-edge
    depends_on:
      api-gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:443/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    build:
      context: ./backend/redis
      dockerfile: Dockerfile
    image: redis
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    networks:
      - transcendence-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *hc-fast

  ## MONITORING ####

  prometheus:
    build:
      context: ./monitoring/prometheus
      dockerfile: Dockerfile
    image: prometheus
    volumes:
      - prometheus-data:/prometheus
      - ./certs/internal:/certs:ro
    ports:
      - "9090:9090"
    networks:
      - transcendence-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      <<: *hc-service

  grafana:
    build:
      context: ./monitoring/grafana
      dockerfile: Dockerfile
    image: grafana
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    networks:
      - transcendence-backend
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      <<: *hc-service

  alertmanager:
    build:
      context: ./monitoring/alertmanager
      dockerfile: Dockerfile
    image: alertmanager
    volumes:
      - alertmanager-data-extra:/alertmanager
      - alertmanager-data:/var/lib/alertmanager
    expose:
      - "9093"
    networks:
      - transcendence-backend
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/ready || exit 1"]
      <<: *hc-service
