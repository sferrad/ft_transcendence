    restart: unless_stopped
    healthcheck:
      # test: ["executable", "arg"] a definir
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


## SECRETS ####

  vault:
    build:
      context: ./vault
      dockerfile: Dockerfile
    image: vault
    ports:
      - 8200:8200
    volumes:
      - vault-data:/vault/data
    cap_add:
      - IPC_LOCK
    networks:
      - transcendence-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


## MICRO SERVICES ####

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    image: api-gateway
    expose:
      - "8000"
    networks:
      - transcendence-backend
      - transcendence-frontend
    depends_on:
      vault:
        condition: service_healthy
    restart: unless_stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"] ## Route a ajouter dans le main.py
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    image: user-service
    expose:
      - "8001"
    networks:
      - transcendence-backend
      - transcendence-database
    depends_on:
      user-db:
        condition: service-healthy
      vault:
        condition: service-healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"] ## Route a ajouter dans le main.py
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  
