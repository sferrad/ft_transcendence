version: '3.8'

services:
  db:
    image: postgres
    build:
      context: ./postgres
      dockerfile: Dockerfile
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - transcendence
    restart: unless_stopped
    healthcheck:
      # test: ["executable", "arg"] a definir
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  vault:
    image: vault
    build:
      context: ./vault
      dockerfile: Dockerfile
    ports:
      - 8200:8200
    volumes:
      - vault-data:/vault/data
    cap_add:
      - IPC_LOCK
    networks:
      - transcendence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    image: FastAPI
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    networks:
      - transcendence
    depends_on:
      db:
        condition: service-healthy
      vault:
        condition: service-healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"] ## Route a ajouter dans le main.py
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  WAF:
    image: WAF
    build:
      context: ./waf
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    networks:
      - transcendence
    depends_on:
      backend:
        condition: service-healthy
    restart: unless-stopped


  frontend:
    image: React
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - transcendence
    restart: unless-stopped


networks:
  transcendence:
    name: transcendence
    driver: bridge


volumes:
  vault-data:
    name: vault-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/vault
  postgres-data:
    name: postgres-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/postgres