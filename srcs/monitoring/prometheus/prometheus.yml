global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
  - static_configs:
      - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: analytics-service
    static_configs:
      - targets: ["analytics-service:8003"]

  - job_name: chat-service
    static_configs:
      - targets: ["chat-service:8002"]

  - job_name: friends-service
    static_configs:
      - targets: ["friends-service:8004"]

  - job_name: game-service
    static_configs:
      - targets: ["game-service:8005"]

  - job_name: profile-service
    static_configs:
      - targets: ["profile-service:8006"]
      
  - job_name: user-service
    static_configs:
      - targets: ["user-service:8001"]
